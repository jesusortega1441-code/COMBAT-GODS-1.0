name: Compilar mod
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Compilar
        run: gradle build --no-daemon --stacktrace

      - name: Comprobar el contenido del .jar
        run: |
          ls -la build/libs
          unzip -l build/libs/combatgods-*.jar | head -60
          unzip -l build/libs/combatgods-*.jar | grep -q "META-INF/mods.toml" || { echo "FALTA mods.toml dentro del jar"; exit 1; }
          unzip -l build/libs/combatgods-*.jar | grep -q "com/combatgods/CombatGodsMod.class" || { echo "FALTA la clase principal dentro del jar"; exit 1; }

      - name: Guardar como artefacto (GitHub lo entrega dentro de un zip)
        uses: actions/upload-artifact@v4
        with:
          name: combatgods-jar
          path: build/libs/combatgods-*.jar

      - name: Publicar el .jar directo (sin zip) en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-version
          name: Ultima version (.jar directo)
          prerelease: true
          files: build/libs/combatgods-*.jar
