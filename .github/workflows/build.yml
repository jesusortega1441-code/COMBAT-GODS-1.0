name: Compilar mod de Minecraft
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir src.zip y buscar el proyecto
        run: |
          echo "Buscando archivos zip..."
          ls -la
          # Descomprime el src.zip dentro de una carpeta llamada src
          if [ -f "src.zip" ]; then
            mkdir -p src
            unzip -q src.zip -d src/
            echo "src.zip descomprimido correctamente."
          else
            echo "No se encontró src.zip, buscando estructuras..."
          fi
          # Localizar dónde quedó el build.gradle
          GRADLE_FILE=$(find . -name "build.gradle" | head -1)
          DIR=$(dirname "$GRADLE_FILE")
          echo "Carpeta raíz del proyecto encontrada: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Compilar mod con Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - name: Verificar el archivo .jar y el mods.toml
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ls -la build/libs
          unzip -l build/libs/*.jar | grep -q "META-INF/mods.toml" || { echo "ERROR: FALTA el mods.toml dentro del jar"; exit 1; }
          echo "¡Éxito! El mods.toml está en su lugar correcto dentro del jar."

      - name: Subir el .jar listo a Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: version-final
          name: Combat Gods Mod (.jar)
          prerelease: true
          files: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          
